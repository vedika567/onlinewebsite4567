<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simple Website</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        header {
            background: #333;
            color: white;
            padding: 20px;
        }

        header h1 {
            margin-bottom: 10px;
        }

        nav ul {
            list-style: none;
            display: flex;
            gap: 15px;
        }

        nav a {
            color: white;
            text-decoration: none;
            font-weight: bold;
        }

        .hero {
            background: #4CAF50;
            color: white;
            padding: 60px 20px;
            text-align: center;
        }

        .hero .btn {
            display: inline-block;
            margin-top: 15px;
            padding: 10px 20px;
            background: white;
            color: #4CAF50;
            border-radius: 5px;
            text-decoration: none;
            font-weight: bold;
        }

        .content {
            padding: 40px 20px;
            text-align: center;
        }

        footer {
            background: #333;
            color: white;
            text-align: center;
            padding: 15px;
            margin-top: 20px;
        }
    </style>
</head>

<body>

    <!-- Header -->
    <header>
        <h1>My Simple Website</h1>
        <nav>
            <ul>
                <li><a href="#">Home</a></li>
                <li><a href="#">About</a></li>
                <li><a href="#">Services</a></li>
                <li><a href="#">Contact</a></li>
            </ul>
        </nav>
    </header>

    <!-- Hero Section -->
    <section class="hero">
        <h2>Welcome to My Website</h2>
        <p>This is a simple website built with HTML and CSS.</p>
        <a href="#" class="btn">Learn More</a>
    </section>

    <!-- Main Content -->
    <section class="content">
        <h2>About This Site</h2>
        <p>Lorem ipsum dolor sit amet, consectetur adipiscing elit. Nulla vel risus nec ipsum hendrerit faucibus.</p>
    </section>

    <!-- Footer -->
    <footer>
        <p>&copy; 2025 My Simple Website</p>
    </footer>

</body>
</html>
